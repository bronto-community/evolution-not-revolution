# Shared by both labs (project transit-shared): one OpenSearch + Dashboards for both labs' data, Jaeger for the
# enriched lab's trace waterfall, and one load generator that sends the same traffic to both labs.
name: transit-shared

services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits: { nofile: { soft: 65536, hard: 65536 } }
    volumes: [opensearch:/usr/share/opensearch/data]
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: curl -fs localhost:9200/_cluster/health?wait_for_status=yellow
      interval: 30s
      start_period: 600s
      start_interval: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: 2g

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    environment: { DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true" }
    volumes: [./dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro]
    ports: ["127.0.0.1:5601:5601"]
    depends_on: { opensearch: { condition: service_healthy } }
    healthcheck:
      test: curl -fs localhost:5601/api/status
      interval: 30s
      start_period: 600s
      start_interval: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: 1g

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    command: [--config=/etc/jaeger/config.yaml]
    volumes: [./jaeger:/etc/jaeger:ro]
    ports: ["127.0.0.1:16686:16686"]
    restart: unless-stopped
    mem_limit: 1g

  loadgen:
    image: transit-lab/loadgen:1
    command: python loadgen.py
    environment:
      LABS: classic=http://transit-classic-departures-api-1:8000|http://transit-classic-stops-api-1:8001,enriched=http://transit-enriched-departures-api-1:8000|http://transit-enriched-stops-api-1:8001
    volumes: [./state:/state]
    networks: [classic, enriched]
    restart: unless-stopped
    mem_limit: 256m
    profiles: [load]     # started after the labs (it needs their networks)

volumes:
  opensearch:

networks:
  default: { name: transit-shared }
  classic: { name: transit-classic_default, external: true }
  enriched: { name: transit-enriched_default, external: true }
